{# Top-bar bell (always red): number of documents needing attention; data-bell-tone tells expired from expiring. #}
<div class="relative" x-data="{ open: false }" @click.away="open = false">
    <button type="button" @click="open = !open; if (open) htmx.trigger($refs.panel, 'load-dropdown')"
            title="{{ _('notifications.bell_title') }}" aria-label="{{ _('notifications.bell_title') }}"
            class="relative flex items-center gap-1 p-2 text-red-600 hover:text-red-700 dark:text-red-400 dark:hover:text-red-300 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        {% if count > 0 %}
        <span data-bell-count="{{ count }}" data-bell-tone="{{ tone }}" class="text-sm font-bold text-red-600 dark:text-red-400">{{ count if count < 100 else '99+' }}</span>
        {% endif %}
    </button>
    <div x-show="open" x-cloak x-transition x-ref="panel"
         hx-get="/notifications/dropdown" hx-trigger="load-dropdown" hx-target="this" hx-swap="innerHTML"
         class="absolute right-0 mt-2 w-96 max-w-[90vw] bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 z-50">
        <div class="p-4 text-center text-sm text-gray-400">{{ _('common.loading') }}</div>
    </div>
</div>
